# ══════════════════════════════════════════════════════════
#  Pro Scalping Bot – Config
#  كل قيمة تقدر تجاوزها من Railway → Variables
# ══════════════════════════════════════════════════════════

# ── Trading mode ──────────────────────────────────────────
# paper = تداول تجريبي بأسعار حقيقية بدون إرسال أي أمر (الافتراضي)
# live  = أوامر حقيقية — يحتاج TRADING_MODE=live + BINANCE_API_KEY + BINANCE_API_SECRET
mode: paper
paper_balance: 10000       # رصيد افتراضي للوضع التجريبي (USDT)
paper_fee_pct: 0.05        # عمولة افتراضية لكل جهة في الوضع التجريبي (%)

# ── Risk Management ───────────────────────────────────────
# كل قيمة تُفحص عند التشغيل؛ القيم خارج النطاق الآمن توقف البوت برسالة واضحة.
leverage:          10      # الرافعة المالية (1–20)
risk_pct:          0.01    # الخسارة عند ضرب الوقف = 1% من رأس المال (0.001–0.02)
max_daily_loss:    0.05    # عند -5% يومياً: إغلاق كل الصفقات وإيقاف الدخول حتى 00:00 UTC (0.005–0.10)
max_consec_losses: 3       # تخفيض الحجم للنصف بعد 3 خسائر متتالية
max_positions:     5       # أقصى صفقات مفتوحة بنفس الوقت (1–10)
min_rr:            1.8     # أدنى نسبة مكافأة:مخاطرة مقبولة
max_failed_cycles: 3       # تنبيه حرج بعد 3 دورات متتالية لا يمكن فيها قراءة الحساب (لا دخول خلالها)

# ── Strategy ──────────────────────────────────────────────
sl_atr_mult: 1.5           # Stop Loss = 1.5 × ATR
tp_atr_mult: 3.0           # Take Profit = 3.0 × ATR (1:2)
vol_min:     1.2           # حجم تداول أعلى من المتوسط بـ 20%

# ── Bot ───────────────────────────────────────────────────
loop_seconds: 60           # فحص كل 60 ثانية (مناسب لـ 30 زوج)

# ── Top 30 Pairs by Futures Volume ────────────────────────
